name: GitGuardian Secret Scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    # Runs daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ── Job 1: Scan the current repository ──────────────────────────────────────
  scan-current-repo:
    name: Scan ${{ github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitGuardian secret scan
        id: ggshield
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        continue-on-error: true

      - name: Create GitHub issue on secret detection
        if: steps.ggshield.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const eventName = context.eventName;
            const refName   = context.ref;

            const issueBody = [
              "## 🚨 Secret Detected by GitGuardian",
              "",
              "GitGuardian has detected one or more secrets in this repository.",
              "",
              "| Field | Details |",
              "|---|---|",
              `| **Repository** | \`${context.repo.owner}/${context.repo.repo}\` |`,
              `| **Trigger** | \`${eventName}\` on \`${refName}\` |`,
              `| **Workflow run** | [View logs](${runUrl}) |`,
              `| **Commit / SHA** | \`${context.sha}\` |`,
              `| **Severity** | 🔴 High / Critical (review logs for exact level) |`,
              "",
              "## Secret Types to Review",
              "GitGuardian scans for:",
              "- API keys and tokens",
              "- Database passwords",
              "- SSH private keys",
              "- Cloud provider credentials (AWS, GCP, Azure)",
              "- Generic high-entropy strings",
              "",
              "## File Location",
              "The exact file path and line number are available in the [workflow run logs](" + runUrl + ").",
              "Sensitive data is **not** reproduced here to avoid further exposure.",
              "",
              "## Remediation Steps",
              "1. **Immediately invalidate** the exposed credential (rotate the key / token / password).",
              "2. **Remove** the secret from the file and replace it with a reference to a GitHub secret or environment variable.",
              "3. **Purge the secret from git history** using `git filter-repo` or BFG Repo Cleaner.",
              "4. **Verify** the fix by re-running the workflow.",
              "5. **Document** the incident for audit purposes.",
              "",
              "## References",
              "- [GitGuardian Dashboard](https://dashboard.gitguardian.com/)",
              "- [GitHub Encrypted Secrets](https://docs.github.com/en/actions/security-guides/encrypted-secrets)",
              "- [Removing sensitive data from a repository](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository)",
              "",
              "> ⚠️ **Do not close this issue until the secret has been fully rotated and removed from history.**",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 [Secret Scan] Secret detected in ${context.repo.repo} (${eventName})`,
              body:  issueBody,
              labels: ["security", "secret-detected"],
            });

      - name: Send email notification on secret detection
        if: steps.ggshield.outcome == 'failure' && secrets.NOTIFICATION_EMAIL
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 [Secret Scan Alert] Secret detected in ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "GitGuardian Secret Scanner <${{ secrets.MAIL_USERNAME }}>"
          body: |
            GitGuardian has detected a secret in your repository.

            Repository : ${{ github.repository }}
            Trigger    : ${{ github.event_name }} on ${{ github.ref }}
            Commit SHA : ${{ github.sha }}
            Workflow   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Secret types scanned:
              - API keys and tokens
              - Database passwords
              - SSH private keys
              - Cloud provider credentials
              - Generic high-entropy strings

            Recommended actions:
              1. Immediately invalidate / rotate the exposed credential.
              2. Remove the secret from the codebase.
              3. Purge the secret from git history.
              4. Review the GitHub issue created in the repository.
              5. Document the incident for audit purposes.

            View the full scan report in the workflow run linked above.

            -- GitGuardian Secret Scanner (GLFreebush/DevSecOps-Secrets-Scanner)

      - name: Fail workflow on secret detection
        if: steps.ggshield.outcome == 'failure'
        run: |
          echo "::error::GitGuardian detected secrets. Review the created issue and workflow logs."
          exit 1

  # ── Job 2: Scan GLFreebush/Brute-Force-Detection-Engine ─────────────────────
  scan-brute-force-repo:
    name: Scan GLFreebush/Brute-Force-Detection-Engine
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch to avoid duplicate scans on push/PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Brute-Force-Detection-Engine
        uses: actions/checkout@v4
        with:
          repository: GLFreebush/Brute-Force-Detection-Engine
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Run GitGuardian secret scan
        id: ggshield_bfde
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true

      - name: Create GitHub issue on secret detection
        if: steps.ggshield_bfde.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issueBody = [
              "## 🚨 Secret Detected by GitGuardian",
              "",
              "GitGuardian has detected one or more secrets in the **GLFreebush/Brute-Force-Detection-Engine** repository during a scheduled scan.",
              "",
              "| Field | Details |",
              "|---|---|",
              "| **Scanned repository** | `GLFreebush/Brute-Force-Detection-Engine` |",
              `| **Scanner repository** | \`${context.repo.owner}/${context.repo.repo}\` |`,
              `| **Workflow run** | [View logs](${runUrl}) |`,
              `| **Severity** | 🔴 High / Critical (review logs for exact level) |`,
              "",
              "## Secret Types to Review",
              "GitGuardian scans for:",
              "- API keys and tokens",
              "- Database passwords",
              "- SSH private keys",
              "- Cloud provider credentials (AWS, GCP, Azure)",
              "- Generic high-entropy strings",
              "",
              "## File Location",
              `The exact file path and line number are available in the [workflow run logs](${runUrl}).`,
              "Sensitive data is **not** reproduced here to avoid further exposure.",
              "",
              "## Remediation Steps",
              "1. **Immediately invalidate** the exposed credential.",
              "2. **Remove** the secret from the file and replace it with a GitHub secret or environment variable.",
              "3. **Purge** the secret from git history using `git filter-repo` or BFG Repo Cleaner.",
              "4. **Verify** the fix by re-running the workflow.",
              "5. **Document** the incident for audit purposes.",
              "",
              "## References",
              "- [GitGuardian Dashboard](https://dashboard.gitguardian.com/)",
              "- [GitHub Encrypted Secrets](https://docs.github.com/en/actions/security-guides/encrypted-secrets)",
              "",
              "> ⚠️ **Do not close this issue until the secret has been fully rotated and removed from history.**",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: "🚨 [Secret Scan] Secret detected in GLFreebush/Brute-Force-Detection-Engine (scheduled)",
              body:  issueBody,
              labels: ["security", "secret-detected"],
            });

      - name: Send email notification on secret detection
        if: steps.ggshield_bfde.outcome == 'failure' && secrets.NOTIFICATION_EMAIL
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 [Secret Scan Alert] Secret detected in GLFreebush/Brute-Force-Detection-Engine"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "GitGuardian Secret Scanner <${{ secrets.MAIL_USERNAME }}>"
          body: |
            GitGuardian has detected a secret in a monitored repository.

            Scanned Repository : GLFreebush/Brute-Force-Detection-Engine
            Scanner Repository : ${{ github.repository }}
            Trigger            : Scheduled daily scan
            Workflow           : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Secret types scanned:
              - API keys and tokens
              - Database passwords
              - SSH private keys
              - Cloud provider credentials
              - Generic high-entropy strings

            Recommended actions:
              1. Immediately invalidate / rotate the exposed credential.
              2. Remove the secret from the codebase.
              3. Purge the secret from git history.
              4. Review the GitHub issue created in GLFreebush/DevSecOps-Secrets-Scanner.
              5. Document the incident for audit purposes.

            View the full scan report in the workflow run linked above.

            -- GitGuardian Secret Scanner (GLFreebush/DevSecOps-Secrets-Scanner)

      - name: Fail workflow on secret detection
        if: steps.ggshield_bfde.outcome == 'failure'
        run: |
          echo "::error::GitGuardian detected secrets in GLFreebush/Brute-Force-Detection-Engine. Review the created issue and workflow logs."
          exit 1
