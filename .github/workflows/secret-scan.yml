name: Secret Scanning with GitGuardian

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  scan-current-repo:
    name: Scan DevSecOps-Secrets-Scanner
    runs-on: ubuntu-latest
    env:
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitGuardian Scan
        id: ggshield
        uses: GitGuardian/ggshield-action@v1
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Create GitHub Issue on Secret Detection
        if: steps.ggshield.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repo = context.repo;
            const runUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const issueBody = [
              '## 🚨 Secret Detected by GitGuardian',
              '',
              '**Repository:** `GLFreebush/DevSecOps-Secrets-Scanner`',
              `**Triggered by:** ${context.eventName}`,
              `**Branch/Ref:** \`${context.ref}\``,
              `**Commit SHA:** \`${context.sha}\``,
              `**Workflow Run:** [View Details](${runUrl})`,
              '',
              '## Findings Summary',
              '',
              'GitGuardian detected one or more secrets in this repository. Review the workflow run linked above for full details.',
              '',
              '> **Note:** Raw secret values are never stored in this issue. Review the GitGuardian dashboard for sanitized findings.',
              '',
              '## Severity',
              '',
              'Please check the workflow run logs and GitGuardian dashboard to determine the severity level (Critical / High / Medium / Low).',
              '',
              '## Remediation Steps',
              '',
              '1. **Immediately invalidate** the exposed credential (revoke API key, rotate token, change password)',
              '2. **Remove the secret** from the codebase and any relevant configuration files',
              '3. **Purge git history** if the secret was committed — use `git filter-repo` or BFG Repo Cleaner',
              '4. **Generate new credentials** to replace the exposed ones',
              '5. **Store secrets securely** using GitHub Secrets or a secrets manager',
              '6. **Verify** no other locations contain the same secret',
              '',
              '## References',
              '',
              '- [GitGuardian Dashboard](https://dashboard.gitguardian.com/)',
              '- [GitHub Secrets Documentation](https://docs.github.com/en/actions/security-guides/encrypted-secrets)',
              '- [Removing Sensitive Data from Git History](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository)',
            ].join('\n');

            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: `🚨 Secret Detected in ${context.ref} [${context.sha.substring(0, 7)}]`,
              body: issueBody,
              labels: ['security', 'secret-detected'],
            });

      - name: Send Email Notification
        if: steps.ggshield.outcome == 'failure' && env.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '🚨 [ALERT] Secret Detected in GLFreebush/DevSecOps-Secrets-Scanner'
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            A secret has been detected in GLFreebush/DevSecOps-Secrets-Scanner.

            Triggered by: ${{ github.event_name }}
            Branch/Ref:   ${{ github.ref }}
            Commit SHA:   ${{ github.sha }}
            Workflow Run: https://github.com/GLFreebush/DevSecOps-Secrets-Scanner/actions/runs/${{ github.run_id }}

            Recommended Actions:
            1. Immediately invalidate the exposed credential
            2. Remove the secret from the repository
            3. Purge git history if necessary
            4. Generate new credentials
            5. Store secrets securely using GitHub Secrets

            Review the GitHub issue created in the repository for full details.

            GitGuardian Dashboard: https://dashboard.gitguardian.com/

      - name: Fail workflow on secret detection
        if: steps.ggshield.outcome == 'failure'
        run: |
          echo "::error::GitGuardian detected secrets in the repository. Review the created issue and workflow logs."
          exit 1

  scan-brute-force-repo:
    name: Scan Brute-Force-Detection-Engine
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
    steps:
      - name: Checkout Brute-Force-Detection-Engine
        uses: actions/checkout@v4
        with:
          repository: GLFreebush/Brute-Force-Detection-Engine
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Run GitGuardian Scan
        id: ggshield_bfde
        uses: GitGuardian/ggshield-action@v1
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Create GitHub Issue on Secret Detection
        if: steps.ggshield_bfde.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueBody = [
              '## 🚨 Secret Detected by GitGuardian',
              '',
              '**Repository:** `GLFreebush/Brute-Force-Detection-Engine`',
              `**Triggered by:** ${context.eventName}`,
              `**Workflow Run:** [View Details](${runUrl})`,
              '',
              '## Findings Summary',
              '',
              'GitGuardian detected one or more secrets in the `GLFreebush/Brute-Force-Detection-Engine` repository. Review the workflow run linked above for full details.',
              '',
              '> **Note:** Raw secret values are never stored in this issue. Review the GitGuardian dashboard for sanitized findings.',
              '',
              '## Severity',
              '',
              'Please check the workflow run logs and GitGuardian dashboard to determine the severity level (Critical / High / Medium / Low).',
              '',
              '## Remediation Steps',
              '',
              '1. **Immediately invalidate** the exposed credential (revoke API key, rotate token, change password)',
              '2. **Remove the secret** from the codebase and any relevant configuration files',
              '3. **Purge git history** if the secret was committed — use `git filter-repo` or BFG Repo Cleaner',
              '4. **Generate new credentials** to replace the exposed ones',
              '5. **Store secrets securely** using GitHub Secrets or a secrets manager',
              '6. **Verify** no other locations contain the same secret',
              '',
              '## References',
              '',
              '- [GitGuardian Dashboard](https://dashboard.gitguardian.com/)',
              '- [GitHub Secrets Documentation](https://docs.github.com/en/actions/security-guides/encrypted-secrets)',
              '- [Removing Sensitive Data from Git History](https://docs.github.com/en/actions/security-guides/removing-sensitive-data-from-a-repository)',
            ].join('\n');

            await github.rest.issues.create({
              owner: 'GLFreebush',
              repo: 'Brute-Force-Detection-Engine',
              title: '🚨 Secret Detected in GLFreebush/Brute-Force-Detection-Engine',
              body: issueBody,
              labels: ['security', 'secret-detected'],
            });

      - name: Send Email Notification
        if: steps.ggshield_bfde.outcome == 'failure' && env.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '🚨 [ALERT] Secret Detected in GLFreebush/Brute-Force-Detection-Engine'
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            A secret has been detected in GLFreebush/Brute-Force-Detection-Engine.

            Triggered by: ${{ github.event_name }}
            Workflow Run: https://github.com/GLFreebush/DevSecOps-Secrets-Scanner/actions/runs/${{ github.run_id }}

            Recommended Actions:
            1. Immediately invalidate the exposed credential
            2. Remove the secret from the repository
            3. Purge git history if necessary
            4. Generate new credentials
            5. Store secrets securely using GitHub Secrets

            Review the GitHub issue created in the DevSecOps-Secrets-Scanner repository for full details.

            GitGuardian Dashboard: https://dashboard.gitguardian.com/

      - name: Fail workflow on secret detection
        if: steps.ggshield_bfde.outcome == 'failure'
        run: |
          echo "::error::GitGuardian detected secrets in GLFreebush/Brute-Force-Detection-Engine. Review the created issue and workflow logs."
          exit 1
